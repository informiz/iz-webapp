apiVersion: apps/v1
kind: Deployment
metadata:
  name: iz-deployment
spec:
  selector:
    matchLabels:
      app: webapp
      channel: demo-channel
  replicas: 2
  template:
    metadata:
      labels:
        app: webapp
        channel: demo-channel
    spec:
      serviceAccountName: demo-channel-ksa
      containers:
      - name: iz-webapp
        image: europe-docker.pkg.dev/key-master-283113/iz-webapp/iz-webapp:0.2.3-MIGTEST
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /health/
            port: 8083
          initialDelaySeconds: 30
          failureThreshold: 10
          periodSeconds: 10
        volumeMounts:
          - mountPath: /tmp
            name: tmp-volume
          - mountPath: /cert
            name: cert
            readOnly: true
        env:
        - name: profile
          value: prod
        - name: iz.channel.name
          value: demo-channel
        - name: iz.channel.id
          value: beta-channel.informiz.org
        - name: iz.channel.media.folder
          value: beta-channel.informiz.org
        - name: iz.webapp.token.issuer
          value: demo-channel
        - name: iz.webapp.token.audience
          value: demo-channel
        - name: iz.webapp.token.secret
          valueFrom:
            secretKeyRef:
              name: demo-channel-jwt-secret
              key: secret
        - name: server.ssl.key-store-password
          valueFrom:
            secretKeyRef:
              name: demo-channel-backend-cert
              key: password
        - name: spring.datasource.url
          valueFrom:
            secretKeyRef:
              name: demo-channel-db-creds
              key: url
        - name: spring.datasource.username
          valueFrom:
            secretKeyRef:
              name: demo-channel-db-creds
              key: username
        - name: spring.datasource.password
          valueFrom:
            secretKeyRef:
              name: demo-channel-db-creds
              key: password
        - name: spring.security.oauth2.client.registration.google.client-id
          valueFrom:
            secretKeyRef:
              name: demo-channel-oauth-creds
              key: client
        securityContext:
          runAsNonRoot: true
          runAsUser: 22222
          runAsGroup: 22222
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - NET_BIND_SERVICE
      - name: cloud-sql-proxy
        # It is recommended to use the latest version of the Cloud SQL proxy
        # Make sure to update on a regular schedule!
        # TODO: Add -verbose=false
        image: eu.gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
        command:
          - "/cloud-sql-proxy"
          - "key-master-283113:europe-west1:informiz-beta"
        securityContext:
          runAsNonRoot: true
          capabilities:
            drop:
              - NET_RAW
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cert
          secret:
            secretName: demo-channel-backend-cert
